[package]
name = "agent-action-capsule"
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Agent Action Capsule reference verification: RFC 8785 canonicalization and capsule_id, the Class 1 record checks, Producer Envelopes, and Evidence Bundles."
repository = "https://github.com/action-state-group/agent-action-capsule"
documentation = "https://docs.rs/agent-action-capsule"
readme = "README.md"
keywords = ["scitt", "agent-action-capsule", "jcs", "cose", "verification"]
categories = ["cryptography"]
# The library, its interlock example and the registry snapshots it embeds.
# The tests read the shared conformance vectors from the repository root,
# which does not ship.
include = ["src/**/*.rs", "examples/**/*.rs", "data/REGISTRY.md", "data/cpb_provisional.json", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "agent_action_capsule"
path = "src/lib.rs"

[features]
default = []
# Evidence Bundle v2. Off by default: checkpointed-local-log also carries an
# HTTP witness client, which record verification does not need.
bundle = ["dep:cll", "dep:base64", "dep:serde", "dep:evidence-request"]
# Strict Evidence Bundle verification (`bundle::verify_bundle_strict`) and
# the witness receipt checks (`witness`).
strict = ["bundle", "dep:p256"]
# The two-party settlement verifier (`settlement`).
settlement = ["dep:base64"]
# The inference-service history profile's Standard level
# (`inference_history`): derivation and checks. Reads checkpoint times with
# the evidence-request crate's RFC 3339 reader.
inference-history = ["dep:evidence-request"]

[dependencies]
# arbitrary_precision keeps each number's source text, so float and
# unsafe-integer detection read the literal digits (as Go's json.Number does).
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", optional = true }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
cll = { package = "checkpointed-local-log", version = "0.4.0", optional = true }
base64 = { version = "0.22", optional = true }
# The one Controller Binding v0 record verifier (`bundle`: the composed/v1
# controller_binding join reads a binding record only through it).
evidence-request = { version = "0.4.0", path = "../evidence-request", default-features = false, features = ["controller-binding"], optional = true }
# Witness receipts (`strict`): the ECDSA P-256 keys and signatures of COSE
# Receipts and of a Rekor entry's Signed Entry Timestamp. Receipts are decoded
# by the crate's own strict CBOR reader.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Test receipts and statements are built with coset.
coset = "0.4"

[[test]]
name = "bundle_vectors"
required-features = ["bundle"]

[[test]]
name = "bundle_strict_vectors"
required-features = ["strict"]

[[test]]
name = "anchor_witness_vectors"
required-features = ["strict"]

[[test]]
name = "bundle_producer"
required-features = ["strict"]

[[test]]
name = "bundle_02_vectors"
required-features = ["strict"]

[[test]]
name = "settlement_vectors"
required-features = ["settlement"]

[[example]]
name = "cross_language"
required-features = ["strict"]

[[test]]
name = "bundle_composed_vectors"
required-features = ["strict"]

[[test]]
name = "inference_history_vectors"
required-features = ["inference-history"]

[[test]]
name = "inference_history_derive"
required-features = ["inference-history"]

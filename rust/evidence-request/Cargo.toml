[package]
name = "evidence-request"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "The evidence request protocol (draft-mih-agent-evidence-request-00): parse, digest and resolve requests; sign and verify refusals and the interop profile's artifact envelope; check Checkpointed Local Log material and the profile's acceptance records; classify outcomes, invariance and retention."
repository = "https://github.com/action-state-group/agent-action-capsule"
readme = "README.md"
keywords = ["scitt", "evidence", "transparency", "protocol", "agents"]
categories = ["cryptography", "encoding"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[lib]
name = "evidence_request"
path = "src/lib.rs"

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
ciborium = "0.2"
# The JSON binding carries the envelope's byte strings as unpadded base64url.
base64 = "0.22"
# COSE_Sign1 parsing for witness receipts (`receipt`).
coset = { version = "0.4", optional = true }
thiserror = "1"
# The Checkpointed Local Log's MMR hashing and commitment form, for checking
# its verification material (`cll`). The same line evidencebook builds on.
cll = { package = "checkpointed-local-log", version = "0.3.1", optional = true }
# BIP-340 Schnorr verification for a `bip340` (Nostr) key in a controller
# binding (`controller_binding`). The 0.13 line shares elliptic-curve, sha2
# and signature with the workspace's p256 0.13 and ed25519-dalek 2.
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"], optional = true }

[features]
default = []
# Witness receipt verification (`receipt`): RFC 9162 Ed25519 receipts.
receipt = ["dep:coset"]
# Checking the interop profile's Checkpointed Local Log material
# (`cll_material`). Without it the crate is the protocol core, with no
# checkpointed-local-log dependency.
cll = ["dep:cll"]
# The interop profile's acceptance records and receipts (`acceptance`,
# §11.1). No new dependency.
acceptance = []
# Controller Binding v0 (`controller_binding`,
# spec/controller-binding-v0.md): binding records, revocation statements, a
# declared revocation list, and the issuer_independence a binding gives.
controller-binding = ["dep:k256"]

[dev-dependencies]
# receipt_vectors.rs decodes base64 fixtures.
base64 = "0.22"

[[test]]
name = "controller_binding_vectors"
required-features = ["controller-binding"]

[[test]]
name = "acceptance_vectors"
required-features = ["acceptance"]

[[test]]
name = "receipt_vectors"
required-features = ["receipt"]

[[test]]
name = "cll_vectors"
required-features = ["cll"]

[[test]]
name = "cll_material"
required-features = ["cll"]

[[test]]
name = "cll_material_vectors"
required-features = ["cll"]

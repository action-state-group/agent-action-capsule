[package]
name = "evidence-request"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The evidence request protocol (draft-mih-agent-evidence-request-00): parse, digest and resolve requests; sign and verify refusals; build and verify artifact answers over a checkpointed local log; classify outcomes, invariance and retention."
repository = "https://github.com/action-state-group/agent-action-capsule"
readme = "README.md"
keywords = ["scitt", "evidence", "transparency", "protocol", "agents"]
categories = ["cryptography", "encoding"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[lib]
name = "evidence_request"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
ciborium = "0.2"
# COSE_Sign1 parsing for witness receipts (`receipt`); already in the tree
# through `cll`.
coset = { version = "0.4", optional = true }
# Witness receipts travel base64 in checkpoint JSON.
base64 = { version = "0.22", optional = true }
thiserror = "1"
# The checkpointed local log: checkpoints, inclusion, range and consistency
# proofs for the answer path.
cll = { package = "checkpointed-local-log", version = "0.2.0", optional = true }

[features]
default = ["answer"]
# Witness receipt verification (`receipt`): RFC 9162 Ed25519 receipts.
receipt = ["dep:coset"]
# The artifact answer path (`answer`) over a checkpointed local log. Without
# it (`default-features = false`) the crate is the protocol core: registry,
# request parsing and digest, resolution, refusals, outcomes, invariance and
# retention, with no checkpointed-local-log dependency.
answer = ["receipt", "dep:cll", "dep:base64"]

[dev-dependencies]
# receipt_vectors.rs decodes base64 fixtures with the `receipt` feature alone.
base64 = "0.22"

[[test]]
name = "answer"
required-features = ["answer"]

[[test]]
name = "receipt_vectors"
required-features = ["receipt"]

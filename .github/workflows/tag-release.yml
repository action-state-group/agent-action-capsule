# SPDX-License-Identifier: BSD-3-Clause
# Step 2 of a release: tag a merged version bump and start its publisher.
#
# On every push to main, compare each package's manifest version (listed in
# .github/releases.json) with the previous main commit. For a package whose
# version changed, create the <prefix><version> tag and GitHub Release on the
# pushed commit, then dispatch the package's publish workflow on that tag. A
# release made with GITHUB_TOKEN would not trigger the publisher's `release`
# event, so the dispatch is what starts it; the publisher's own guard and
# environment tag rule still decide whether anything uploads.
# See RELEASING.md.
name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create the tag and GitHub Release
  actions: write   # dispatch the publish workflow

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag and publish changed versions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python .github/release.py changed "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/released.txt"
          if [ ! -s "$RUNNER_TEMP/released.txt" ]; then
            echo "No package version changed."; exit 0
          fi
          while read -r package version tag workflow; do
            python .github/release.py check "$package" "$tag" --commit "$GITHUB_SHA"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
              if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists on another commit" >&2; exit 1
              fi
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
                --notes "$package $version. See CHANGELOG.md."
            fi
            gh workflow run "$workflow" --ref "$tag"
            echo "Tagged $tag and dispatched $workflow." >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/released.txt"

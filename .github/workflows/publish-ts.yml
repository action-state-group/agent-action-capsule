# SPDX-License-Identifier: BSD-3-Clause
# Adapted from capsule-emit-ts publish.yml at ffdaf4dd817d0dc89e1fc95bde9da278523a7922.
name: Publish TypeScript npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in ts/package.json to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-ts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ts
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require main branch and matching version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "npm releases must run from main." >&2; exit 1; }
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          assert.equal(pkg.name, "@action-state-group/agent-action-capsule");
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].name, pkg.name);
          assert.equal(lock.packages[""].version, pkg.version);
          assert.equal(pkg.publishConfig.access, "public");
          JS

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.1

      - name: Require OIDC-capable npm
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), "npm >=11.5.1 is required for trusted publishing");
          JS

      - name: Install dependencies
        run: npm ci

      - name: Check and build package
        run: npm run check

      - name: Validate publish artifact without uploading
        run: npm publish --dry-run --access public

      - name: Publish package if needed
        id: publish
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "$package_name@$package_version" version --json >"$RUNNER_TEMP/published-version.json" 2>"$RUNNER_TEMP/view-error.txt"; then
            test "$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/published-version.json", "utf8"))')" = "$package_version"
            echo "$package_name@$package_version is already published; skipping npm publish."
            echo "published_now=false" >> "$GITHUB_OUTPUT"
          elif node -e 'const e = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/published-version.json", "utf8")); process.exit(e.error?.code === "E404" ? 0 : 1)'; then
            npm publish --access public
            echo "published_now=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/view-error.txt" >&2
            exit 1
          fi

      - name: Tag published TypeScript commit
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.package_version }}
          PUBLISHED_NOW: ${{ steps.publish.outputs.published_now }}
        run: |
          tag="ts/v$PACKAGE_VERSION"
          if [[ "$PUBLISHED_NOW" = "true" ]]; then
            published_git_head="$GITHUB_SHA"
          else
            published_git_head=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead)
          fi
          [[ "$published_git_head" =~ ^[0-9a-f]{40}$ ]] || { echo "npm gitHead is missing or invalid." >&2; exit 1; }
          git merge-base --is-ancestor "$published_git_head" "$GITHUB_SHA"
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$remote_tag" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$published_git_head"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes "npm release $PACKAGE_NAME@$PACKAGE_VERSION"
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$published_git_head" --title "$tag" --notes "npm release $PACKAGE_NAME@$PACKAGE_VERSION"
          fi
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -n 1 "$tag")" = "$published_git_head"

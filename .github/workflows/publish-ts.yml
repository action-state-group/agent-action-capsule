# SPDX-License-Identifier: BSD-3-Clause
# Adapted from capsule-emit-ts publish.yml at ffdaf4dd817d0dc89e1fc95bde9da278523a7922.
# Publishes ts/ to npm via OIDC trusted publishing for a ts/v<version> tag,
# which tag-release.yml creates when a version bump merges. See RELEASING.md.
name: Publish TypeScript package

on:
  release:
    types: [published]
  # tag-release.yml dispatches this on the ts/v<version> tag it creates.
  workflow_dispatch: {}

permissions:
  contents: read

# One publish at a time for this package, so the dist-tag choice below sees
# npm as the previous publish left it. GitHub keeps one pending run per group,
# so a third release queued behind two is cancelled; re-run it.
concurrency:
  group: npm-publish-ts
  cancel-in-progress: false

jobs:
  publish:
    # Only a ts/v tag publishes: a published GitHub Release for it, or a
    # dispatch on it. The guard below and the npm environment's ts/v* tag rule
    # refuse anything else.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ts/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/ts/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    defaults:
      run:
        working-directory: ts
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require a matching tag on main
        working-directory: .
        run: python .github/release.py check ts "$RELEASE_TAG"

      - name: Require a consistent package and lockfile
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          assert.equal(pkg.name, "@action-state-group/agent-action-capsule");
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].name, pkg.name);
          assert.equal(lock.packages[""].version, pkg.version);
          assert.equal(pkg.publishConfig.access, "public");
          JS

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.1

      - name: Require OIDC-capable npm
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), "npm >=11.5.1 is required for trusted publishing");
          JS

      - name: Install dependencies
        run: npm ci

      - name: Check and build package
        run: npm run check

      - name: Choose the dist-tag
        # npm refuses a prerelease without an explicit dist-tag, and `latest`
        # must never move backward: a stable version older than npm's current
        # `latest` (a backport, or a release that finished out of order)
        # publishes under `backport` instead.
        run: |
          version=$(node -p "require('./package.json').version")
          # Only a clean answer or an explicit "not found" counts: treating a
          # registry or network error as "no latest" could move latest backward.
          if ! latest=$(npm view "$(node -p "require('./package.json').name")" dist-tags.latest 2>"$RUNNER_TEMP/latest-error.txt"); then
            grep -q E404 "$RUNNER_TEMP/latest-error.txt" || { cat "$RUNNER_TEMP/latest-error.txt" >&2; exit 1; }
            latest=""
          fi
          dist_tag=$(node -e '
            const [version, latest] = process.argv.slice(1);
            const core = (v) => v.split("-")[0].split(".").map(Number);
            const older = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] < b[i]; return false; };
            console.log(version.includes("-") ? "next" : latest && older(core(version), core(latest)) ? "backport" : "latest");
          ' "$version" "$latest")
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - name: Validate publish artifact without uploading
        run: npm publish --dry-run --access public --tag "$DIST_TAG"

      - name: Publish package if needed
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version --json >"$RUNNER_TEMP/published-version.json" 2>"$RUNNER_TEMP/view-error.txt"; then
            test "$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/published-version.json", "utf8"))')" = "$package_version"
            # A version npm already has must come from this tag's commit;
            # otherwise the release would describe code npm does not serve.
            published_head=$(npm view "$package_name@$package_version" gitHead)
            if [ "$published_head" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$package_name@$package_version on npm was built from ${published_head:-an unknown commit}, not $(git rev-parse HEAD)" >&2
              exit 1
            fi
            echo "$package_name@$package_version is already published from this commit; skipping npm publish."
          elif node -e 'const e = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/published-version.json", "utf8")); process.exit(e.error?.code === "E404" ? 0 : 1)'; then
            npm publish --access public --tag "$DIST_TAG"
          else
            cat "$RUNNER_TEMP/view-error.txt" >&2
            exit 1
          fi

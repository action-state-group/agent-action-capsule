name: Python CI
on:
  push:
    branches: [main]
    paths: ["python/**", "spec/REGISTRY.md", "vectors/interop/ran_under/**", "vectors/bundle/**", "vectors/evidence-request/**", "vectors/cll-material/**", "vectors/anchor-witness-v1/**", "vectors/card-registration-v0/**", "vectors/minimum-necessary/**", ".github/**"]
  pull_request:
    paths: ["python/**", "spec/REGISTRY.md", "vectors/interop/ran_under/**", "vectors/bundle/**", "vectors/evidence-request/**", "vectors/cll-material/**", "vectors/anchor-witness-v1/**", "vectors/card-registration-v0/**", "vectors/minimum-necessary/**", ".github/**"]

# A newer push to the same pull request supersedes its older run; runs on
# main are never cancelled, since each is grouped by its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python-version }}" }
      - name: install
        working-directory: python
        run: pip install -e ".[dev,transparent,anchor]"
      - name: install cll reference (bundle completeness proofs)
        # The evidence-bundle vectors verify against real CLL MMR proofs, and the
        # strict-mode vectors against its COSE checkpoint verifier (0.9.0+). Install
        # the released checkpointed-local-log reference (import package `cll`) so
        # they actually run instead of importorskip-skipping.
        run: pip install "checkpointed-local-log>=0.9,<0.10"
      - name: require cll importable (the bundle vectors use importorskip; fail loud in CI)
        # test_bundle_vectors.py importorskips cll so local dev without it still runs the
        # rest of the suite; here cll MUST be present, so a broken/empty install fails the
        # job instead of silently skipping every real-CLL bundle-vector assertion.
        run: python -c "import cll.checkpoint, cll.checkpoint.index"
      - name: ruff
        working-directory: python
        run: python -m ruff check .
      - name: pytest
        working-directory: python
        run: python -m pytest -q

      # The leak-lint tests live next to the lint in .github/, outside the test paths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q .github/test_leak_lint.py

      - name: release helper tests
        run: python -m pytest -q .github/test_release.py

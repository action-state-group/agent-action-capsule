name: python
on:
  push:
    paths: ["python/**", "spec/REGISTRY.md", "vectors/interop/ran_under/**", "vectors/bundle/**", "vectors/minimum-necessary/**", ".github/**"]
  pull_request:
    paths: ["python/**", "spec/REGISTRY.md", "vectors/interop/ran_under/**", "vectors/bundle/**", "vectors/minimum-necessary/**", ".github/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python-version }}" }
      - name: install
        working-directory: python
        run: pip install -e ".[dev,transparent,anchor]"
      - name: install cll reference (bundle completeness proofs)
        # The evidence-bundle vectors verify against real CLL MMR proofs. Install
        # the public checkpointed-local-log reference (import package `cll`) pinned
        # to the merged range-proof API (#13) so the 12 bundle vectors, incl. both
        # interior-tamper negatives, actually run instead of importorskip-skipping.
        run: pip install "checkpointed-local-log @ git+https://github.com/action-state-group/checkpointed-local-log@deb7617497820f03d876e3a776f7a25e135fd423"
      - name: require cll importable (the bundle vectors use importorskip; fail loud in CI)
        # test_bundle_vectors.py importorskips cll so local dev without it still runs the
        # rest of the suite; here cll MUST be present, so a broken/empty install fails the
        # job instead of silently skipping every real-CLL bundle-vector assertion.
        run: python -c "import cll.checkpoint, cll.checkpoint.index"
      - name: ruff
        working-directory: python
        run: python -m ruff check .
      - name: pytest
        working-directory: python
        run: python -m pytest -q

      # The leak-lint tests live next to the lint in .github/, outside the test paths. They use
      # synthetic terms only, so this pull_request job needs no secret.
      - name: leak-lint tests
        run: python -m pytest -q .github/test_leak_lint.py

      - name: release helper tests
        run: python -m pytest -q .github/test_release.py

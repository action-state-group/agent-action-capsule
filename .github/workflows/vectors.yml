name: Vector regeneration

# A full regeneration must reproduce the committed corpus, so a generator that
# drops or rewrites a released case fails here instead of silently losing
# coverage.
on:
  push:
    paths: ["python/**", "ts/**", "vectors/**", "provenance-mode-vectors/**", ".github/workflows/vectors.yml"]
  pull_request:
    paths: ["python/**", "ts/**", "vectors/**", "provenance-mode-vectors/**", ".github/workflows/vectors.yml"]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: install
        run: |
          pip install -e "python[dev]"
          npm ci --prefix ts
      - name: regenerate
        run: python python/scripts/generate_all_vectors.py
      - name: require an unchanged corpus
        run: |
          status=$(git status --porcelain -- vectors provenance-mode-vectors)
          if [ -n "$status" ]; then
            echo "$status"
            git diff --stat -- vectors provenance-mode-vectors
            echo "::error::generate_all_vectors.py does not reproduce the committed vectors"
            exit 1
          fi

name: dual-runtime conformance

on:
  push:
    paths:
      - "go/**"
      - "python/**"
      - "test-vectors/**"
      - "producer-envelope-vectors/**"
      - "spec/draft-mih-scitt-agent-action-capsule-04.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "go/**"
      - "python/**"
      - "test-vectors/**"
      - "producer-envelope-vectors/**"
      - "spec/draft-mih-scitt-agent-action-capsule-04.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"

# Both runtimes run in the same job against the same frozen manifest; a single
# divergence fails the job. No shared caches between runtimes.
jobs:
  conformance:
    name: "dual-runtime: Python + Go vs frozen vectors"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Python runtime ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # pip cache is separate from Go module cache; runtimes share no state
      - name: python — install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: python — lint
        working-directory: python
        run: python -m ruff check .

      - name: python — full tests and shared vectors
        working-directory: python
        run: python -m pytest -v

      # ── Go runtime ──────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false   # fresh env: no module cache reuse across jobs
      - name: go — build
        working-directory: go
        run: go build ./...

      - name: go — formatting
        working-directory: go
        run: test -z "$(gofmt -l .)"

      - name: go — vet
        working-directory: go
        run: go vet ./...

      - name: go — full tests and shared envelope vectors
        working-directory: go
        run: go test ./...

      - name: go — race tests
        working-directory: go
        run: go test -race ./...
      - name: go — shared Capsule vector runner
        working-directory: go
        run: go run ./cmd/vector_runner/

      # ── Differential summary ────────────────────────────────────────────────
      # Both runtimes independently validate the frozen Capsule and Producer
      # Envelope corpora. If either fails, this step is unreachable.
      # This step records the zero-divergence assertion in the CI log.
      - name: differential check — zero divergences
        run: |
          echo "Both runtimes completed."
          echo "Python and Go passed both shared conformance corpora."
          echo ""
          echo "Conformance assertion: two independent runtimes, all frozen vectors, zero divergences."
          echo "RFC 7942 readiness: implemented and cross-runtime checked."

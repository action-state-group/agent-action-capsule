name: Cross-language conformance

on:
  push:
    paths:
      - "go/**"
      - "python/**"
      - "ts/**"
      - "rust/**"
      - "vectors/**"
      - "provenance-mode-vectors/**"
      - "scripts/cross-language-interlock.sh"
      - "scripts/browser-conformance.mjs"
      - "spec/draft-mih-scitt-agent-action-capsule-05.md"
      - "spec/draft-mih-agent-disclosure-envelope-00.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "go/**"
      - "python/**"
      - "ts/**"
      - "rust/**"
      - "vectors/**"
      - "provenance-mode-vectors/**"
      - "scripts/cross-language-interlock.sh"
      - "scripts/browser-conformance.mjs"
      - "spec/draft-mih-scitt-agent-action-capsule-05.md"
      - "spec/draft-mih-agent-disclosure-envelope-00.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    name: Python reference, Go, TypeScript and Rust interlock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python reference
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Check Python reference
        working-directory: python
        run: |
          python -m ruff check .
          python -m pytest -q

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so the installed Go must
          # satisfy go.mod itself rather than download a newer toolchain.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check Go conformance implementation
        working-directory: go
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
          go test -race ./...
          go run ./cmd/vector_runner/

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Check TypeScript conformance implementation
        working-directory: ts
        run: |
          npm ci
          npm run check

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the Rust interlock adapter
        working-directory: rust
        run: cargo build --locked --example cross_language

      - name: Verify every producer in every consumer
        run: scripts/cross-language-interlock.sh

      - name: Prove every consumer rejects a canonicalization divergence
        run: AAC_INTERLOCK_INJECT_CANONICALIZATION_DIVERGENCE=1 scripts/cross-language-interlock.sh

      - name: Assert zero unintentional divergence
        run: |
          echo "Python, Go, and TypeScript passed the same committed vector tree; Rust runs it in rust-conformance."
          echo "Capsules sealed in Python, Go, TypeScript and Rust verified in all four."
          echo "Python- and Go-built Disclosure Envelopes passed DE-3 verification in all three runtimes."

  rust-conformance:
    name: Rust verifier runs the shared corpora
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check the Rust verifier
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-features
          cargo test --locked

      # evidence-request without its default `answer` feature is the protocol
      # core, which must build and pass with no checkpointed-local-log.
      - name: Check evidence-request's feature combinations
        run: |
          for features in "--no-default-features" "--no-default-features --features receipt"; do
            cargo clippy --locked -p evidence-request --all-targets $features -- -D warnings
            cargo test --locked -p evidence-request $features
          done
          if cargo tree --locked -p evidence-request --no-default-features -e normal | grep -q checkpointed-local-log; then
            echo "evidence-request's core depends on checkpointed-local-log" >&2; exit 1
          fi

      # A consumer such as capsule-emit unifies serde_json's preserve_order
      # into the build; results must not depend on map iteration order.
      - name: Check the Rust verifier with serde_json preserve_order
        run: cargo test --locked --all-features --features serde_json/preserve_order

      - name: Check the crate packages for crates.io
        run: |
          python3 ../.github/scripts/check_crate_metadata.py agent-action-capsule/Cargo.toml evidence-request/Cargo.toml
          cargo package --locked -p agent-action-capsule
          cargo package --locked --list -p evidence-request
          cargo package --locked -p evidence-request

      # evidence-request's dependencies are all on crates.io, so a dry run
      # resolves them from the registry index, as a real upload would.
      - name: Publish dry run, evidence-request (no upload)
        run: cargo publish --locked --dry-run -p evidence-request

  browser-conformance:
    name: Built browser artifact conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build TypeScript package
        working-directory: ts
        run: |
          npm ci
          npm run build

      - name: Run vectors in a bundled headless browser
        run: scripts/browser-conformance.mjs

  pinned-legacy-format-2-verification:
    name: Pinned legacy verifier verifies July format-2 interop record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen legacy verifier release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: legacy-verify/v0.1.0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the cited July interop record
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          result="$RUNNER_TEMP/legacy-format-2-result.json"
          python -c 'from agent_action_capsule.cli import main; raise SystemExit(main(["verify", __import__("sys").argv[1], "--json"]))' \
            docs/interop/purchase-example/capsule.json > "$result"
          python - "$result" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          capsule = json.loads(Path("docs/interop/purchase-example/capsule.json").read_text())
          vector = json.loads(Path("docs/interop/aac-aep-scitt-digest-binding-vector.json").read_text())
          expected_id = vector["positive"]["capsule_id"]["hex"]
          assert result["ok"] is True
          assert result["capsule_id_recomputed"] == capsule["capsule_id"] == expected_id
          PY

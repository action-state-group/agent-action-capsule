name: cross-language conformance

on:
  push:
    paths:
      - "go/**"
      - "python/**"
      - "ts/**"
      - "vectors/**"
      - "scripts/cross-language-interlock.sh"
      - "spec/draft-mih-scitt-agent-action-capsule-04.md"
      - "spec/draft-mih-scitt-agent-action-capsule-disclosure-envelope-00.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "go/**"
      - "python/**"
      - "ts/**"
      - "vectors/**"
      - "scripts/cross-language-interlock.sh"
      - "spec/draft-mih-scitt-agent-action-capsule-04.md"
      - "spec/draft-mih-scitt-agent-action-capsule-disclosure-envelope-00.md"
      - "spec/REGISTRY.md"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    name: Python reference, Go and TypeScript interlock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python reference
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Check Python reference
        working-directory: python
        run: |
          python -m ruff check .
          python -m pytest -q

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum
      - name: Check Go conformance implementation
        working-directory: go
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
          go test -race ./...
          go run ./cmd/vector_runner/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Check TypeScript conformance implementation
        working-directory: ts
        run: |
          npm ci
          npm run check

      - name: Verify every producer in every consumer
        run: scripts/cross-language-interlock.sh

      - name: Assert zero divergence
        run: |
          echo "Python, Go, and TypeScript passed the same committed vector tree."
          echo "Python-, Go-, and TypeScript-sealed format-4 Capsules verified in all three runtimes."
